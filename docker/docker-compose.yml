version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../backend/data:/app/data:ro
    environment:
      - DEBUG=true
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - ai-tutor-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://159.65.201.164:8000/api/v1
    depends_on:
      - backend
    networks:
      - ai-tutor-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-tutor-network

networks:
  ai-tutor-network:
    driver: bridge

volumes:
  redis-data:
